server {

    listen 80;
    listen [::]:80;


    server_name backend.bksdev.my.id;
    root /var/www/backend.bksdev.my.id/public;
    index index.php index.html index.htm;

    location / {
       # limit_req zone=one burst=10 nodelay;
        # try_files $uri $uri/ /index.php$is_args$args;
        try_files $uri $uri/ =404;
        
    }

    location ~ \.php$ {
        try_files $uri =404;
        # try_files $uri /index.php =404;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        #fixes timeouts
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    # Menambahkan header untuk mencegah caching pada file JS dan CSS
    # location ~* \.(js|css)$ {
    #     add_header Cache-Control "no-cache, no-store, must-revalidate";
    #     add_header Pragma "no-cache";
    #     add_header Expires "0";
    # }

    error_page 404 /404.html;

    location = /404.html {
        root /var/www/bksdev.my.id/public;
        internal;
    }

    error_log /var/log/nginx/backend_app_error.log;
    access_log /var/log/nginx/backend_app_access.log main;
}
