user www-data;
worker_processes auto;
pid /run/nginx.pid;
daemon off;

events {
  worker_connections  2048;
  multi_accept on;
  use epoll;
}

http {

  # Definisikan zona rate limiting
  limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/s;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 15;
  types_hash_max_size 2048;
  client_max_body_size 500M;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
  #access_log /dev/stdout;
  #error_log /dev/stderr;
  gzip on;
  gzip_disable "msie6";
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;

  gzip_types
  application/atom+xml
  application/javascript
  application/json
  application/rss+xml
  application/vnd.ms-fontobject
  application/x-font-ttf
  application/x-web-app-manifest+json
  application/xhtml+xml
  application/xml
  font/opentype
  image/svg+xml
  image/x-icon
  text/css
  text/plain
  text/x-component;
  
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-ECDSA-DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS';
  
  # Terapkan rate limiting secara global di level server
  limit_req zone=global_limit burst=10 nodelay;


   # Blok untuk menangani permintaan dari *.unri.ac.id
    # server {
    #     listen 80;
    #     listen 443 ssl;
    #     server_name ~^.*\.unri\.ac\.id$;

    #     ssl_certificate /var/certs/solusiku.my.id/cert.pem;
    #     ssl_certificate_key /var/certs/solusiku.my.id/privkey.pem;

    #     if ($host ~* \.unri\.ac\.id$) {
    #         return 403;
    #     }

    #     # Meneruskan permintaan ke server tujuan
    #     # location / {
    #     #     proxy_pass http://TARGET_IP_OR_DOMAIN;
    #     #     proxy_set_header Host $host;
    #     #     proxy_set_header X-Real-IP $remote_addr;
    #     #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     #     proxy_set_header X-Forwarded-Proto $scheme;
    #     # }
    # }

  # Tambahkan format log khusus
  log_format domain_not_found '$http_x_forwarded_for - $remote_user - $remote_addr - $host [$time_local] "domain_not_found" '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent"';

  log_format main '$http_x_forwarded_for - $remote_user - $remote_addr - $host [$time_local]  "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
        

  # server {
  #     listen 80 ;
  #     listen 443 ssl;
  #     server_name _;

  #     ssl_certificate /var/certs/solusiku.my.id/cert.pem;
  #     ssl_certificate_key /var/certs/solusiku.my.id/privkey.pem;
      
  #     access_log /var/log/nginx/domain_not_found.log domain_not_found;

  #     location / {
  #         return 444;  # Tutup koneksi tanpa mengirimkan respons apa pun
  #     }
  # }


  include /etc/nginx/conf.d/*.conf;
  include /etc/nginx/sites-available/*.conf;
  open_file_cache off; # Disabled for issue 619
  charset UTF-8;
}
