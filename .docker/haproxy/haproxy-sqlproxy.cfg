global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend mysql-write
    bind *:3306
    default_backend mysql-write-backend

frontend mysql-read
    bind *:3307
    default_backend mysql-read-backend

backend mysql-write-backend
    balance roundrobin
    server master db:3306 check

backend mysql-read-backend
    balance roundrobin
    server slave1 slave1:3306 check
    server slave2 slave2:3306 check

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 20s


frontend http_front
    bind *:9000
    stats uri /haproxy?stats
    default_backend php_backend

backend php_backend
    balance roundrobin
    server php1 php:9000 check
    server php2 php:9000 check
    server php3 php:9000 check
